<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenmeldung - Hubertus Strullendorf</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        .secondary { background: #666; }
    </style>
</head>
<body>

<div class="card">
    <div id="auth-ui">
        <h2>Anmelden</h2>
        <input type="email" id="email" placeholder="E-Mail">
        <input type="password" id="password" placeholder="Passwort">
        <button onclick="doLogin()">Einloggen</button>
        <button onclick="doSignup()" class="secondary">Registrieren</button>
    </div>

    <div id="form-ui" style="display:none;">
        <h2>Stunden melden</h2>
        <input type="date" id="date">
        <input type="number" id="hours" placeholder="Stundenzahl">
        <textarea id="task" placeholder="Was hast du gemacht?"></textarea>
        <button onclick="sendData()">Absenden</button>
        <button onclick="doLogout()" class="secondary">Abmelden</button>
    </div>
    <p id="msg" style="text-align: center;"></p>
</div>

<script>
    // ### NUR HIER DEINE DATEN EINTRAGEN ###
    const S_URL = 'https://dewsihgtmlbhwqriduzc.supabase.co';
    const S_KEY = 'sb_publishable_rz_QtyYZcDoY5LcNzgZk1Q_o2HbDO7m';

    // Initialisierung (Nur einmal!)
    const sb = supabase.createClient(S_URL, S_KEY);

    sb.auth.onAuthStateChange((event, session) => {
        document.getElementById('auth-ui').style.display = session ? 'none' : 'block';
        document.getElementById('form-ui').style.display = session ? 'block' : 'none';
        if(session) document.getElementById('date').valueAsDate = new Date();
    });

    async function doSignup() {
        const { error } = await sb.auth.signUp({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });
        if (error) alert(error.message);
        else alert("Registrierung erfolgreich! Du kannst dich jetzt einloggen.");
    }

    async function doLogin() {
        const { error } = await sb.auth.signInWithPassword({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });
        if (error) alert(error.message);
    }

    async function doLogout() { await sb.auth.signOut(); }

    async function sendData() {
        const user = (await sb.auth.getUser()).data.user;
        const { error } = await sb.from('work_hours').insert([{ 
            user_id: user.id, 
            duration: document.getElementById('hours').value, 
            description: document.getElementById('task').value, 
            date: document.getElementById('date').value 
        }]);

        const m = document.getElementById('msg');
        if (error) { m.innerText = error.message; m.style.color = "red"; }
        else { m.innerText = "Gespeichert!"; m.style.color = "green"; }
    }
</script>
</body>
</html>
