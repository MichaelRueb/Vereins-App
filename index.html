<div id="auth-section" class="card">
    <h2>Anmelden</h2>
    <input type="email" id="email" placeholder="E-Mail">
    <input type="password" id="password" placeholder="Passwort">
    <button onclick="login()">Einloggen</button>
    <button onclick="signup()" style="background: #666; margin-top: 5px;">Registrieren</button>
</div>

<div id="form-section" class="card" style="display:none;">
    <h2>Stunden melden</h2>
    <button onclick="logout()" style="background: #d32f2f;">Abmelden</button>
</div>

<script>
    // ... (Supabase Initialisierung wie vorher) ...

    // Prüfen, ob Nutzer schon eingeloggt ist
    supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
        } else {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('form-section').style.display = 'none';
        }
    });

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
    }

    async function signup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert("Check deine E-Mails zur Bestätigung!");
    }

    async function logout() {
        await supabase.auth.signOut();
    }
</script>
