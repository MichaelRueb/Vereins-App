<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenmeldung - Hubertus Strullendorf</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .secondary { background: #666; margin-top: 10px; }
        label { font-size: 0.85em; font-weight: bold; color: #555; margin-top: 10px; display: block; }
        .progress-container { background: #eee; border-radius: 10px; height: 25px; width: 100%; margin: 15px 0; overflow: hidden; position: relative; }
        .progress-bar { background: #2e7d32; height: 100%; width: 0%; transition: width 0.5s; }
        .progress-text { position: absolute; width: 100%; text-align: center; line-height: 25px; font-size: 0.8em; font-weight: bold; color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85em; }
        th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; }
        .admin-box { border: 2px solid #2e7d32; padding: 15px; margin-top: 20px; border-radius: 10px; background: #e8f5e9; width: 100%; box-sizing: border-box; }
        .stats-table th { background: #2e7d32; color: white; }
    </style>
</head>
<body>

<div class="card">
    <div id="auth-ui">
        <h2 id="auth-title">Anmelden</h2>
        <div id="signup-fields" style="display:none;">
            <label>Dein Name:</label>
            <input type="text" id="full_name" placeholder="Vor- und Nachname">
        </div>
        <label>E-Mail:</label>
        <input type="email" id="email" placeholder="beispiel@mail.de">
        <label>Passwort:</label>
        <input type="password" id="password" placeholder="******">
        <div id="login-buttons">
            <button onclick="doLogin()">Einloggen</button>
            <button onclick="showSignup()" class="secondary">Neues Konto erstellen</button>
        </div>
        <div id="signup-buttons" style="display:none;">
            <button onclick="doSignup()">Jetzt Registrieren</button>
            <button onclick="showLogin()" class="secondary">Zurück zum Login</button>
        </div>
    </div>

    <div id="form-ui" style="display:none;">
        <h2 style="margin-bottom:0;">Stundenmeldung</h2>
        <p style="margin-top:5px; color:#666;">Hubertus Strullendorf</p>

        <div class="progress-container">
            <div id="p-bar" class="progress-bar"></div>
            <div id="p-text" class="progress-text">0 / 10h</div>
        </div>

        <label>Datum:</label>
        <input type="date" id="date">
        <label>Tätigkeit:</label>
        <select id="activity">
            <option value="Standreinigung">Standreinigung</option>
            <option value="Fahnenabordnung">Fahnenabordnung</option>
            <option value="Reinigungsarbeit">Reinigungsarbeit</option>
            <option value="Helferdienst bei Festen">Helferdienst bei Festen</option>
            <option value="Sonstiges">Sonstiges</option>
        </select>
        <textarea id="description" placeholder="Zusatzinfos..."></textarea>
        <input type="number" id="hours" step="0.5" placeholder="Stunden (z.B. 2.5)">
        <button id="sendBtn" onclick="sendData()">Absenden</button>
        
        <hr>
        <h3>Deine Meldungen</h3>
        <table>
            <thead><tr><th>Datum</th><th>Std.</th><th>Status</th></tr></thead>
            <tbody id="history-body"></tbody>
        </table>

        <div id="admin-ui" class="admin-box" style="display:none;">
            <h3>🛡️ Admin-Bereich</h3>
            <p><strong>Offene Bestätigungen:</strong></p>
            <div id="admin-list" style="font-size:0.9em;">Lade...</div>
            
            <p style="margin-top:20px;"><strong>Mitglieder-Übersicht:</strong></p>
            <table class="stats-table">
                <thead><tr><th>Name</th><th>Gesamt</th></tr></thead>
                <tbody id="admin-stats-body"></tbody>
            </table>
        </div>

        <button onclick="doLogout()" class="secondary" style="margin-top:30px;">Abmelden</button>
    </div>
</div>

<script>
    const S_URL = 'https://dewsihgtmlbhwqriduzc.supabase.co';
    const S_KEY = 'sb_publishable_rz_QtyYZcDoY5LcNzgZk1Q_o2HbDO7m';
    const sb = supabase.createClient(S_URL, S_KEY);

    sb.auth.onAuthStateChange(async (event, session) => {
        if (session) {
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('form-ui').style.display = 'block';
            document.getElementById('date').valueAsDate = new Date();
            loadHistory();
            checkAdminStatus(session.user.id);
        } else {
            document.getElementById('auth-ui').style.display = 'block';
            document.getElementById('form-ui').style.display = 'none';
        }
    });

    function showSignup() {
        document.getElementById('signup-fields').style.display = 'block';
        document.getElementById('signup-buttons').style.display = 'block';
        document.getElementById('login-buttons').style.display = 'none';
        document.getElementById('auth-title').innerText = 'Konto erstellen';
    }

    function showLogin() {
        document.getElementById('signup-fields').style.display = 'none';
        document.getElementById('signup-buttons').style.display = 'none';
        document.getElementById('login-buttons').style.display = 'block';
        document.getElementById('auth-title').innerText = 'Anmelden';
    }

    async function doLogin() {
        const { error } = await sb.auth.signInWithPassword({ 
            email: document.getElementById('email').value, 
            password: document.getElementById('password').value 
        });
        if (error) alert("Fehler: " + error.message);
    }

    async function doSignup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('full_name').value;
        if (!fullName) return alert("Name fehlt!");

        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) alert(error.message);
        else {
            await sb.from('profiles').insert([{ id: data.user.id, full_name: fullName }]);
            alert("Erfolgreich! Bitte E-Mail bestätigen.");
            showLogin();
        }
    }

    async function doLogout() { await sb.auth.signOut(); }

    async function checkAdminStatus(uid) {
        const { data } = await sb.from('roles').select('name').eq('user_id', uid).maybeSingle();
        if (data && (data.name === 'Admin' || data.name === 'Funktionär')) {
            document.getElementById('admin-ui').style.display = 'block';
            loadAdminTasks();
            loadAdminStats();
        }
    }

    async function loadAdminTasks() {
        // Dank Foreign Key können wir jetzt sauber joinen!
        const { data } = await sb.from('work_hours')
            .select('id, date, duration, description, profiles(full_name)')
            .eq('status', 'pending');

        const list = document.getElementById('admin-list');
        if (data && data.length > 0) {
            list.innerHTML = data.map(row => `
                <div style="padding:10px; background:white; border-radius:5px; margin-bottom:10px; border:1px solid #ccc;">
                    <strong>👤 ${row.profiles?.full_name || 'Unbekannt'}</strong><br>
                    <small>${new Date(row.date).toLocaleDateString('de-DE')}</small> | <strong>${row.duration}h</strong><br>
                    <p style="margin:5px 0; font-size:0.9em;">${row.description}</p>
                    <button onclick="approveEntry(${row.id})" style="width:auto; padding:5px 10px; font-size:0.8em;">Bestätigen</button>
                </div>
            `).join('');
        } else { list.innerHTML = "Keine offenen Aufgaben."; }
    }

    async function loadAdminStats() {
        const { data: profiles } = await sb.from('profiles').select('id, full_name');
        const { data: hours } = await sb.from('work_hours').select('user_id, duration').eq('status', 'approved');
        
        const statsBody = document.getElementById('admin-stats-body');
        if (profiles) {
            statsBody.innerHTML = profiles.map(p => {
                const total = hours ? hours.filter(h => h.user_id === p.id).reduce((sum, h) => sum + h.duration, 0) : 0;
                return `<tr><td>${p.full_name}</td><td><strong>${total} / 10h</strong></td></tr>`;
            }).join('');
        }
    }

    async function approveEntry(id) {
    // 1. Status in der Datenbank aktualisieren
    const { error } = await sb
        .from('work_hours')
        .update({ status: 'approved' })
        .eq('id', id);

    if (error) {
        console.error("Fehler beim Bestätigen:", error);
        alert("Fehler: " + error.message);
    } else {
        // 2. Ansicht sofort aktualisieren
        console.log("Eintrag " + id + " wurde bestätigt.");
        loadAdminTasks(); // Liste der offenen Aufgaben neu laden
        loadAdminStats(); // Mitglieder-Statistik neu berechnen
        loadHistory();    // Eigene Historie/Fortschrittsbalken aktualisieren
    }
}

    async function sendData() {
    const h = document.getElementById('hours').value;
    const date = document.getElementById('date').value;
    const activity = document.getElementById('activity').value;
    const desc = document.getElementById('description').value;

    if (!h || !date) return alert("Bitte Datum und Stunden eingeben!");

    // Button deaktivieren, um Mehrfachklicks zu verhindern
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerText = "Wird gesendet...";

    const { data: { user } } = await sb.auth.getUser();

    // WICHTIG: Wir senden KEINE 'id' mit, die DB macht das von allein
    const { error } = await sb.from('work_hours').insert([{
        user_id: user.id,
        date: date,
        duration: parseFloat(h),
        description: activity + ": " + desc,
        status: 'pending'
    }]);

    if (error) {
        console.error("Speicherfehler:", error);
        alert("Fehler beim Speichern: " + error.message);
        btn.disabled = false;
        btn.innerText = "Stunden absenden";
    } else {
        alert("Stunden wurden zur Prüfung gesendet!");
        // Formular leeren
        document.getElementById('hours').value = '';
        document.getElementById('description').value = '';
        btn.disabled = false;
        btn.innerText = "Stunden absenden";
        loadHistory();
    }
}

    async function loadHistory() {
        const { data: { user } } = await sb.auth.getUser();
        const { data } = await sb.from('work_hours').select('*').eq('user_id', user.id).order('date', { ascending: false });
        if (data) {
            let total = 0;
            document.getElementById('history-body').innerHTML = data.map(row => {
                if (row.status === 'approved') total += row.duration;
                return `<tr><td>${new Date(row.date).toLocaleDateString('de-DE')}</td><td>${row.duration}h</td><td>${row.status === 'approved' ? '✅' : '⏳'}</td></tr>`;
            }).join('');
            const p = Math.min((total / 10) * 100, 100);
            document.getElementById('p-bar').style.width = p + '%';
            document.getElementById('p-text').innerText = total + ' / 10h';
        }
    }
</script>
</body>
</html>
