<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenmeldung - Hubertus Strullendorf</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; display: flex; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #1b5e20; }
        .secondary { background: #666; }
        label { font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>

<div id="app" class="card">
    <div id="auth-ui">
        <h2>Anmelden</h2>
        <input type="email" id="email" placeholder="E-Mail">
        <input type="password" id="password" placeholder="Passwort (min. 6 Zeichen)">
        <button onclick="handleLogin()">Einloggen</button>
        <button onclick="handleSignup()" class="secondary">Registrieren</button>
    </div>

    <div id="form-ui" style="display:none;">
        <h2>Stunden melden</h2>
        <p>Hubertus Strullendorf</p>
        <label>Datum:</label>
        <input type="date" id="date">
        <label>Stunden:</label>
        <input type="number" id="hours" step="0.5" placeholder="z.B. 2.5">
        <label>Was hast du gemacht?</label>
        <textarea id="task" placeholder="z.B. Standreinigung"></textarea>
        <button onclick="sendData()">Stunden absenden</button>
        <hr>
        <button onclick="handleLogout()" class="secondary">Abmelden</button>
    </div>
    <p id="msg" style="text-align: center; font-weight: bold;"></p>
</div>

<script>
    // ### WICHTIG: HIER DEINE DATEN EINTRAGEN ###
    const SUPABASE_URL = 'https://DEINE_PROJEKT_ID.supabase.co';
    const SUPABASE_KEY = 'DEIN_ANON_KEY';

    // Supabase Client initialisieren
    const supabase = lib.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Automatischer Wechsel zwischen Login und Formular
    supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('form-ui').style.display = 'block';
            document.getElementById('date').valueAsDate = new Date();
        } else {
            document.getElementById('auth-ui').style.display = 'block';
            document.getElementById('form-ui').style.display = 'none';
        }
    });

    async function handleSignup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) alert("Fehler: " + error.message);
        else alert("Registrierung erfolgreich! Du kannst dich jetzt einloggen.");
    }

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert("Login fehlgeschlagen: " + error.message);
    }

    async function handleLogout() {
        await supabase.auth.signOut();
    }

    async function sendData() {
        const date = document.getElementById('date').value;
        const hours = document.getElementById('hours').value;
        const task = document.getElementById('task').value;
        const user = (await supabase.auth.getUser()).data.user;

        const { error } = await supabase.from('work_hours').insert([
            { user_id: user.id, duration: hours, description: task, date: date }
        ]);

        const msg = document.getElementById('msg');
        if (error) {
            msg.innerText = "Fehler: " + error.message;
            msg.style.color = "red";
        } else {
            msg.innerText = "Erfolgreich gespeichert!";
            msg.style.color = "green";
            document.getElementById('hours').value = "";
            document.getElementById('task').value = "";
        }
    }
</script>
</body>
</html>
