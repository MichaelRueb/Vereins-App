<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hubertus Stunden & Kalender Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PDF Bibliotheken -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <script>
    const S_URL = 'https://dewsihgtmlbhwqriduzc.supabase.co';
    const S_KEY = 'sb_publishable_rz_QtyYZcDoY5LcNzgZk1Q_o2HbDO7m';
    const sb = supabase.createClient(S_URL, S_KEY);
    const ADMIN_EMAIL = "zonk1981.mz@googlemail.com";
    const ALL_TEAMS = ["Luftgewehr 1", "Luftgewehr 2", "Luftgewehr 3", "Luftgewehr Auflage", "Luftpistole 1", "Luftpistole 2", "Sportpistole", "Großkaliber", "Passiv / Sonstige"];

    let currentUser, userTeam = "", isAdmin = false, isCaptain = false, isOfficial = false, allEvents = [], currentViewDate = new Date();

    window.onload = async () => {
        const { data: { session } } = await sb.auth.getSession();
        if (session) setupApp(session.user);
        else { document.getElementById('loading-ui').style.display='none'; document.getElementById('auth-ui').style.display='block'; }
    };

    async function handleAuth() {
        const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
        if(error) alert(error.message); else location.reload();
    }

    async function setupApp(user) {
        currentUser = user; 
        isAdmin = user.email === ADMIN_EMAIL;
        
        const { data: p } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
        
        if (p) {
            userTeam = p.team || ""; 
            isCaptain = p.is_captain || false; 
            isOfficial = p.is_official || false;
            document.getElementById('prof-name').value = p.full_name || "";
            
            if (isAdmin || isOfficial || isCaptain) {
                document.getElementById('tab-admin').style.display = 'block';
                if (isAdmin) document.getElementById('admin-pdf-btn').style.display = 'block';
                document.getElementById('captain-event-form').style.display = 'block';
                fillTeamSelect();
            }
        }

        renderTeamCheckboxes(userTeam);
        document.getElementById('loading-ui').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        
        loadHistory(); 
        await loadAllEvents(); // Warten, bis Events da sind
    }

    function fillTeamSelect() {
        const sel = document.getElementById('event-team-select');
        const myTeams = userTeam ? userTeam.split(',').map(t => t.trim()) : [];
        const allowedTeams = (isAdmin || isOfficial) ? ALL_TEAMS.filter(t => t !== "Passiv / Sonstige") : myTeams;
        sel.innerHTML = allowedTeams.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    async function saveNewEvent() {
        const date = document.getElementById('event-date').value;
        const time = document.getElementById('event-time').value;
        const team = document.getElementById('event-team-select').value;
        const opponent = document.getElementById('event-opponent').value;
        if (!date || !opponent || !team) return alert("Bitte Datum, Team und Gegner angeben!");
        const { error } = await sb.from('tournaments').insert([{ date, time, team, opponent }]);
        if (error) alert("Fehler: " + error.message); else { alert("Wettkampf gespeichert!"); document.getElementById('event-opponent').value = ''; loadAllEvents(); }
    }

    async function updatePassword() {
        const p1 = document.getElementById('new-pass').value;
        const p2 = document.getElementById('new-pass-confirm').value;
        if(p1 !== p2 || p1.length < 6) return alert("Passwörter stimmen nicht überein (min. 6 Zeichen)");
        const { error } = await sb.auth.updateUser({ password: p1 });
        if(error) alert("Fehler: " + error.message); else alert("Passwort geändert!");
    }

    async function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const { data: profs } = await sb.from('profiles').select('*').order('full_name');
        const { data: hours } = await sb.from('work_hours').select('*').eq('status', 'approved').order('date');
        doc.setFontSize(22); doc.setTextColor(46, 125, 50);
        doc.text("SV Hubertus 1955 e.V. Strullendorf", 105, 20, { align: "center" });
        const tableRows = [];
        profs.forEach(p => {
            const memberHours = hours ? hours.filter(h => h.user_id === p.id) : [];
            const total = memberHours.reduce((s, h) => s + parseFloat(h.duration), 0);
            tableRows.push([{ content: p.full_name || 'Unbekannt', styles: { fontStyle: 'bold', fillColor: [245, 245, 245] } }, p.team || '-', { content: `${total} h`, styles: { halign: 'right' } }]);
            if (memberHours.length > 0) {
                let detailText = memberHours.map(h => `  • ${h.date}: ${h.description} (${h.duration}h)`).join('\n');
                tableRows.push([{ content: detailText, colSpan: 3, styles: { fontSize: 8, textColor: 80 } }]);
            }
        });
        doc.autoTable({ startY: 40, head: [['Mitglied', 'Mannschaft', 'Summe']], body: tableRows, theme: 'grid' });
        doc.save("Hubertus_Report.pdf");
    }

    async function loadAdmin() {
        const { data: profs } = await sb.from('profiles').select('*').order('full_name');
        const { data: hours } = await sb.from('work_hours').select('*').order('date', {descending:true});
        const pending = hours.filter(h => h.status === 'pending');
        document.getElementById('admin-pending-body-real').innerHTML = pending.map(h => {
            const u = profs.find(p => p.id === h.user_id);
            return `<tr><td>${u?.full_name}<br><small>${h.date}</small></td><td>${h.description}</td><td>${h.duration}h</td><td><button onclick="approveHours('${h.id}')" style="width:auto; padding:5px 10px;">OK</button></td></tr>`;
        }).join('') || '<tr><td>Keine neuen Anträge</td></tr>';
        document.getElementById('admin-member-table-list').innerHTML = profs.map(p => {
            const sum = hours.filter(h => h.user_id === p.id && h.status === 'approved').reduce((s, h) => s + parseFloat(h.duration), 0);
            return `<tr><td onclick="viewUserDetail('${p.id}')" style="color:var(--primary); cursor:pointer;">${p.full_name}</td><td>${sum}h</td><td><div class="admin-role-group"><label><input type="checkbox" ${p.is_captain?'checked':''} onchange="updateRole('${p.id}','is_captain',this.checked)"> Kapt.</label><label><input type="checkbox" ${p.is_official?'checked':''} onchange="updateRole('${p.id}','is_official',this.checked)"> Funk.</label></div></td></tr><tr id="details-${p.id}" style="display:none;"><td colspan="3" id="content-${p.id}"></td></tr>`;
        }).join('');
    }

    async function viewUserDetail(uid) {
        const el = document.getElementById(`details-${uid}`);
        if(el.style.display === 'table-row') { el.style.display = 'none'; return; }
        const { data } = await sb.from('work_hours').select('*').eq('user_id', uid).order('date', {descending:true});
        document.getElementById(`content-${uid}`).innerHTML = data.map(h => `${h.date} - ${h.duration}h - ${h.description}`).join('<br>') || 'Keine Einträge';
        el.style.display = 'table-row';
    }

    async function updateRole(uid, col, val) { const d = {}; d[col] = val; await sb.from('profiles').update(d).eq('id', uid); loadAdmin(); }
    async function approveHours(id) { await sb.from('work_hours').update({ status: 'approved' }).eq('id', id); loadAdmin(); }
    
    async function loadAllEvents() {
        const { data: t } = await sb.from('tournaments').select('*');
        const { data: c } = await sb.from('club_events').select('*');
        allEvents = [...(t || []), ...(c || []).map(e => ({ ...e, team: 'Verein', opponent: e.title }))];
        renderEventFilter(); 
        renderCalendar(); 
        renderTournamentList();
    }

    function renderEventFilter() {
        const filterSelect = document.getElementById('event-view-filter');
        let options = `<option value="my_relevant">⭐ Meine Teams & Verein</option>`;
        options += `<option value="all_teams">🌐 Alle Termine (Gesamtansicht)</option>`;
        options += `<option value="Verein">📅 Nur Vereinstermine</option>`;
        options += `<option value="only_sports">🎯 Alle Mannschaften</option>`;
        options += `<option disabled>────────────────────</option>`;
        options += ALL_TEAMS.map(t => `<option value="${t}">Nur ${t}</option>`).join('');
        filterSelect.innerHTML = options;
        filterSelect.value = "my_relevant";
    }

    function renderTournamentList() {
        const filter = document.getElementById('event-view-filter').value;
        const myTeams = userTeam ? userTeam.split(',').map(t => t.trim()).filter(t => t !== "") : [];

        const filtered = allEvents.filter(e => {
            const eventTeam = e.team ? e.team.trim() : "";
            if (filter === 'all_teams') return true;
            if (filter === 'Verein') return eventTeam === 'Verein';
            if (filter === 'only_sports') return eventTeam !== 'Verein';
            if (filter === 'my_relevant') {
                return eventTeam === 'Verein' || myTeams.includes(eventTeam);
            }
            return eventTeam === filter;
        }).sort((a, b) => new Date(a.date) - new Date(b.date));

        const sportsEvents = filtered.filter(e => e.team !== 'Verein');
        const clubEvents = filtered.filter(e => e.team === 'Verein');

        let html = '';
        if (sportsEvents.length > 0) {
            html += `<tr style="background:#f8f9fa; border-left:4px solid #2e7d32;"><td colspan="5" style="padding:12px;"><b>🎯 Wettkampftermine</b></td></tr>`;
            sportsEvents.forEach(e => {
                html += `<tr><td>${new Date(e.date).toLocaleDateString('de-DE')}</td><td>${e.time?.substring(0, 5) || '--:--'}</td><td style="color:#1565c0; font-weight:bold;">${e.team}</td><td>${e.opponent || '-'}</td><td>-</td></tr>`;
            });
        }
        if (clubEvents.length > 0) {
            html += `<tr style="background:#f8f9fa; border-left:4px solid #ef6c00;"><td colspan="5" style="padding:12px;"><b>📅 Vereinstermine</b></td></tr>`;
            clubEvents.forEach(e => {
                html += `<tr><td>${new Date(e.date).toLocaleDateString('de-DE')}</td><td>${e.time?.substring(0, 5) || '--:--'}</td><td style="color:#666;">${e.team}</td><td>${e.opponent || '-'}</td><td>-</td></tr>`;
            });
        }
        document.getElementById('tournament-list-body').innerHTML = html || '<tr><td colspan="5" style="text-align:center; padding:20px; color:#999;">Keine Termine gefunden.</td></tr>';
    }
    
    function renderCalendar() {
        const container = document.getElementById('calendar-container'); container.innerHTML = '';
        const y = currentViewDate.getFullYear(), m = currentViewDate.getMonth();
        document.getElementById('current-month-display').innerText = new Intl.DateTimeFormat('de-DE', {month:'long', year:'numeric'}).format(currentViewDate);
        ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d => container.innerHTML += `<div style="background:#eee; text-align:center; padding:5px; font-size:0.8em;">${d}</div>`);
        const start = (new Date(y, m, 1).getDay() + 6) % 7;
        for(let i=0; i<start; i++) container.innerHTML += `<div></div>`;
        for(let d=1; d<=new Date(y, m + 1, 0).getDate(); d++) {
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayEvents = allEvents.filter(e => e.date === ds);
            container.innerHTML += `<div class="calendar-day ${new Date().toISOString().split('T')[0] === ds ? 'today' : ''}" onclick="showDay('${ds}')"><small>${d}</small><div class="event-dot-container">${dayEvents.map(e => `<div class="event-dot ${getTeamClass(e.team)}"></div>`).join('')}</div></div>`;
        }
    }

    function showDay(ds) { 
        const evs = allEvents.filter(e => e.date === ds); 
        if(!evs.length) return; 
        document.getElementById('selection-content').innerHTML = evs.map(e => `<strong>${e.team}</strong>: ${e.opponent}`).join('<br>');
        document.getElementById('selection-date-label').innerText = "Termine am " + new Date(ds).toLocaleDateString('de-DE');
        document.getElementById('calendar-selection-details').style.display = 'block'; 
    }

    function switchTab(t) { ['home','events','profile','admin'].forEach(v => { document.getElementById('view-'+v).style.display = (v===t)?'block':'none'; document.getElementById('tab-'+v).className = (v===t)?'tab active':'tab'; }); if(t==='admin') loadAdmin(); }
    function getTeamClass(t) { if(t==='Verein') return 'team-verein'; if(t?.includes('gewehr')) return 'team-lg'; if(t?.includes('pistole')) return 'team-lp'; return ''; }
    
    function renderTeamCheckboxes(sel) { 
        const arr = sel ? sel.split(',').map(t => t.trim()) : []; 
        document.getElementById('team-checkboxes').innerHTML = ALL_TEAMS.map(t => `
            <label class="checkbox-wrapper">
                <input type="checkbox" name="prof-teams" value="${t}" ${arr.includes(t) ? 'checked' : ''}>
                <span>${t}</span>
            </label>`).join(''); 
    }

    async function updateProfile() { 
        const teams = Array.from(document.querySelectorAll('input[name="prof-teams"]:checked')).map(c=>c.value).join(','); 
        await sb.from('profiles').upsert({ id: currentUser.id, full_name: document.getElementById('prof-name').value, team: teams }); 
        userTeam = teams; // Variable aktualisieren
        renderTournamentList(); // Liste sofort neu zeichnen!
        alert("Gespeichert!"); 
    }

    async function sendHours() { await sb.from('work_hours').insert([{ user_id: currentUser.id, date: document.getElementById('date').value, duration: document.getElementById('hours').value, description: document.getElementById('work-category').value + ": " + document.getElementById('description').value, status: 'pending' }]); alert("Gesendet!"); loadHistory(); }
    async function loadHistory() { const { data } = await sb.from('work_hours').select('*').eq('user_id', currentUser.id).order('date', {descending:true}); const approved = data?.filter(x=>x.status==='approved').reduce((s,x)=> s + parseFloat(x.duration), 0) || 0; document.getElementById('my-progress-bar').style.width = (approved*10) + "%"; document.getElementById('my-progress-label').innerText = approved + " / 10 h"; document.getElementById('history-body').innerHTML = data?.map(x=> `<tr><td>${x.date}</td><td>${x.description}</td><td>${x.duration}</td><td>${x.status==='approved'?'✅':'⏳'}</td></tr>`).join(''); }
    function changeMonth(d) { currentViewDate.setMonth(currentViewDate.getMonth()+d); renderCalendar(); }
</script>
</body>
</html>
