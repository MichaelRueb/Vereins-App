<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenmeldung - Hubertus Strullendorf</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .secondary { background: #666; margin-top: 10px; }
        label { font-size: 0.85em; font-weight: bold; color: #555; margin-top: 10px; display: block; }
        .progress-container { background: #eee; border-radius: 10px; height: 25px; width: 100%; margin: 15px 0; overflow: hidden; position: relative; }
        .progress-bar { background: #2e7d32; height: 100%; width: 0%; transition: width 0.5s; }
        .progress-text { position: absolute; width: 100%; text-align: center; line-height: 25px; font-size: 0.8em; font-weight: bold; color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85em; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
        .admin-box { border: 2px solid #2e7d32; padding: 15px; margin-top: 20px; border-radius: 10px; background: #e8f5e9; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <div id="auth-ui">
        <h2 id="auth-title">Anmelden</h2>
        
        <div id="signup-fields" style="display:none;">
            <label>Vollständiger Name:</label>
            <input type="text" id="full_name" placeholder="Vor- und Nachname">
        </div>

        <label>E-Mail:</label>
        <input type="email" id="email" placeholder="beispiel@mail.de">
        <label>Passwort:</label>
        <input type="password" id="password" placeholder="******">
        
        <div id="login-buttons">
            <button onclick="doLogin()">Einloggen</button>
            <button onclick="showSignup()" class="secondary">Neues Konto erstellen</button>
        </div>
        
        <div id="signup-buttons" style="display:none;">
            <button onclick="doSignup()">Jetzt Registrieren</button>
            <button onclick="showLogin()" class="secondary">Zurück zum Login</button>
        </div>
    </div>

    <div id="form-ui" style="display:none;">
        <h2>Stundenmeldung</h2>
        <p>Hubertus Strullendorf</p>

        <label>Dein Fortschritt (Ziel: 10h)</label>
        <div class="progress-container">
            <div id="p-bar" class="progress-bar"></div>
            <div id="p-text" class="progress-text">0 / 10h</div>
        </div>

        <label>Datum:</label>
        <input type="date" id="date">
        
        <label>Tätigkeit:</label>
        <select id="activity">
            <option value="Standreinigung">Standreinigung</option>
            <option value="Fahnenabordnung">Fahnenabordnung</option>
            <option value="Reinigungsarbeit">Reinigungsarbeit</option>
            <option value="Helferdienst bei Festen">Helferdienst bei Festen</option>
            <option value="Sonstiges">Sonstiges</option>
        </select>

        <label>Zusatzinfos:</label>
        <textarea id="description" placeholder="Was genau hast du gemacht?"></textarea>

        <label>Stundenzahl:</label>
        <input type="number" id="hours" step="0.5" placeholder="z.B. 2.5">

        <button id="sendBtn" onclick="sendData()">Stunden absenden</button>
        
        <hr>
        <h3>Deine letzten Meldungen</h3>
        <table>
            <thead><tr><th>Datum</th><th>Std.</th><th>Status</th></tr></thead>
            <tbody id="history-body"></tbody>
        </table>

        <div id="admin-ui" class="admin-box" style="display:none;">
            <h3>Admin: Offene Bestätigungen</h3>
            <div id="admin-list">Lade...</div>
        </div>

        <button onclick="doLogout()" class="secondary" style="margin-top:30px;">Abmelden</button>
    </div>
</div>

<script>
    const S_URL = 'https://dewsihgtmlbhwqriduzc.supabase.co';
    const S_KEY = 'sb_publishable_rz_QtyYZcDoY5LcNzgZk1Q_o2HbDO7m';
    const sb = supabase.createClient(S_URL, S_KEY);

    // Automatischer Login-Check
    sb.auth.onAuthStateChange(async (event, session) => {
        if (session) {
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('form-ui').style.display = 'block';
            document.getElementById('date').valueAsDate = new Date();
            loadHistory();
            checkAdminStatus(session.user.id);
        } else {
            document.getElementById('auth-ui').style.display = 'block';
            document.getElementById('form-ui').style.display = 'none';
            document.getElementById('admin-ui').style.display = 'none';
        }
    });

    // Umschalten zwischen Login und Registrierung
    function showSignup() {
        document.getElementById('signup-fields').style.display = 'block';
        document.getElementById('signup-buttons').style.display = 'block';
        document.getElementById('login-buttons').style.display = 'none';
        document.getElementById('auth-title').innerText = 'Konto erstellen';
    }

    function showLogin() {
        document.getElementById('signup-fields').style.display = 'none';
        document.getElementById('signup-buttons').style.display = 'none';
        document.getElementById('login-buttons').style.display = 'block';
        document.getElementById('auth-title').innerText = 'Anmelden';
    }

    // AUTH FUNKTIONEN
    async function doLogin() {
        const { error } = await sb.auth.signInWithPassword({ 
            email: document.getElementById('email').value, 
            password: document.getElementById('password').value 
        });
        if (error) alert("Login fehlgeschlagen: " + error.message);
    }

    async function doSignup() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const fullName = document.getElementById('full_name').value;

        if (!fullName) return alert("Bitte Vor- und Nachnamen eingeben!");

        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) {
            alert("Fehler: " + error.message);
        } else if (data.user) {
            // Namen in der 'profiles' Tabelle speichern
            await sb.from('profiles').insert([{ id: data.user.id, full_name: fullName }]);
            alert("Registrierung erfolgreich! Bitte bestätige den Link in deiner E-Mail.");
            showLogin();
        }
    }

    async function doLogout() { await sb.auth.signOut(); }

    // ADMIN FUNKTIONEN
    async function checkAdminStatus(uid) {
        const { data } = await sb.from('roles').select('name').eq('user_id', uid).maybeSingle();
        if (data && (data.name.toLowerCase() === 'admin' || data.name.toLowerCase() === 'funktionär')) {
            document.getElementById('admin-ui').style.display = 'block';
            loadAdminTasks();
        }
    }

    async function loadAdminTasks() {
        // Lädt die Stunden UND verknüpft sie mit dem Namen aus 'profiles'
        const { data, error } = await sb.from('work_hours')
            .select('id, date, duration, description, profiles(full_name)')
            .eq('status', 'pending');

        const list = document.getElementById('admin-list');
        if (data && data.length > 0) {
            list.innerHTML = data.map(row => `
                <div style="padding: 12px 0; border-bottom: 1px solid #ddd;">
                    <strong>👤 ${row.profiles ? row.profiles.full_name : 'Unbekannter Nutzer'}</strong><br>
                    <small>📅 ${new Date(row.date).toLocaleDateString('de-DE')}</small> | <strong>${row.duration}h</strong><br>
                    <p style="margin: 5px 0; font-size: 0.85em; color: #444;">${row.description}</p>
                    <button onclick="approveEntry(${row.id})" style="width:auto; padding:5px 12px; font-size:0.75em;">Genehmigen</button>
                </div>
            `).join('');
        } else {
            list.innerHTML = "Keine neuen Anfragen.";
        }
    }

    async function approveEntry(id) {
        await sb.from('work_hours').update({ status: 'approved' }).eq('id', id);
        loadAdminTasks();
        loadHistory();
    }

    // NUTZER FUNKTIONEN
    async function sendData() {
        const btn = document.getElementById('sendBtn');
        const hours = document.getElementById('hours').value;
        if (!hours) return alert("Bitte Stundenzahl eingeben!");
        btn.disabled = true;

        const { data: { user } } = await sb.auth.getUser();
        await sb.from('work_hours').insert([{
            user_id: user.id,
            date: document.getElementById('date').value,
            duration: parseFloat(hours),
            description: document.getElementById('activity').value + ": " + document.getElementById('description').value,
            status: 'pending'
        }]);
        
        alert("Stunden wurden zur Prüfung gesendet!");
        document.getElementById('hours').value = '';
        document.getElementById('description').value = '';
        btn.disabled = false;
        loadHistory();
    }

    async function loadHistory() {
        const { data: { user } } = await sb.auth.getUser();
        const { data } = await sb.from('work_hours').select('*').eq('user_id', user.id).order('date', { ascending: false });
        if (data) {
            let total = 0;
            const body = document.getElementById('history-body');
            body.innerHTML = data.map(row => {
                if (row.status === 'approved') total += parseFloat(row.duration);
                return `<tr>
                    <td>${new Date(row.date).toLocaleDateString('de-DE')}</td>
                    <td>${row.duration}h</td>
                    <td>${row.status === 'approved' ? '✅' : '⏳'}</td>
                </tr>`;
            }).join('');
            
            // Balken aktualisieren (Ziel 10h)
            const percent = Math.min((total / 10) * 100, 100);
            document.getElementById('p-bar').style.width = percent + '%';
            document.getElementById('p-text').innerText = total + ' / 10h';
        }
    }
</script>
</body>
</html>
